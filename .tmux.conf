# Prefix binding {{{
set -g prefix C-g
unbind C-b
bind g  send-prefix
bind-key C-g last-window
# }}}

# General {{{
set -sg escape-time 0
bind R source-file ~/.tmux.conf \; display-message " ↻ tmux.conf"
bind q confirm-before -p "kill-window #W? (y/n)" kill-window
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set-option -g history-limit 50000
# Auto renumber windows
set-option -g renumber-windows on
set-option -g focus-events on
set -g mouse on
set -s extended-keys on
set -s set-clipboard on
# }}}

# Status bar {{{
set -g status-bg colour7
set -g status-fg colour12
set -g status-left-length 40
set -g status-right-length 60
set -g status-left '#[bg=cyan,fg=white]#{?client_prefix,#[bg=colour1]  ⌘  ,  🔥 } #S   #[default]'
# Recompute Tempo remaining hours at most every 30 min; ~/Sites/timesheet/ts-status.py also runs after each daily post.
set -g status-right '#[bg=colour2,fg=white]  #(f=~/.current_ts; [ -n "$(find $f -mmin -30 2>/dev/null)" ] || { touch $f; ~/Sites/timesheet/ts-status.py >/dev/null 2>&1; }; cat $f)  '
set -g status-position 'top'
set -g base-index 1
set -g status-justify absolute-centre
set-window-option -g pane-base-index 1
# set-window-option -g window-status-fg colour239
# set-window-option -g window-status-bg colour7

# window format {{{
setw -g window-status-format '#[fg=colour12,noreverse] #I·#[default,noreverse]#{?window_linked,#[italics],}#{?window_zoomed_flag,[[ #W ]],#W}#[noitalics] '
setw -g window-status-current-format '#[fg=colour2,bg=colour15] ●#[fg=colour250] #[fg=cyan,bg=colour15]#{?window_linked,#[italics],}#{?window_zoomed_flag,[[ #W ]],#W}#[noitalics] '
# }}}
# }}}

# Set window notifications {{{
setw -g monitor-activity on
set -g visual-activity off
setw -g monitor-bell on
set -g bell-action other
setw -g window-status-bell-style 'fg=colour1,bold'

# Automatically set window title
# setw -g automatic-rename
set-option -g allow-rename off
# }}}

# window management {{{
unbind %
unbind s
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind-key S command-prompt "attach-session -t '%%'"
bind s display-popup -E -w 40% -h 40% tmux-switch
bind » next-window
bind « previous-window
#link shared:ts
bind T link-window -s shared:ts
# }}}

# Vi style bindings {{{
setw -g mode-keys vi
unbind Escape
unbind -Tcopy-mode-vi Space
unbind -Tcopy-mode-vi Enter
bind -Tcopy-mode-vi v send -X begin-selection
bind -Tcopy-mode-vi y send -X copy-selection-and-cancel

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# }}}

# Resizing {{{
bind -r < resize-pane -L 15
bind -r > resize-pane -R 15
bind -r - resize-pane -D 15
bind -r + resize-pane -U 15
# }}}

# Misc {{{
bind o run ~/.dotfiles/tmux-url-select/tmux-url-select.pl
bind G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind C display-popup -E -w 90% -h 90% -d "#{pane_current_path}" claude
# }}}

run-shell ~/.tmux/fingers/tmux-fingers.tmux
